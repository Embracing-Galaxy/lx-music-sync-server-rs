name: Release
run-name: Release ${{ github.ref_name }}

on:
  push:
    tags:
      - v*

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            setup: sudo apt-get update && sudo apt-get install -y libssl-dev pkg-config
            release-dir: target/release

          - target: x86_64-unknown-linux-musl
            container:
              image: rust:alpine
            setup: apk add --no-cache openssl-dev musl-dev pkgconfig
            release-dir: target/release

    runs-on: ubuntu-latest
    container: ${{ matrix.container }}

    env:
      CARGO_HOME: ${{ github.workspace }}/.cargo

    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable
        if: ${{ !matrix.container }}
        with:
          targets: ${{ matrix.target }}

      - name: Install system dependencies
        run: ${{ matrix.setup }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build
        run: cargo build --release

      - name: Package
        run: |
          BIN="lx-music-sync-server"
          strip "${{ matrix.release-dir }}/$BIN" 2>/dev/null || true
          ASSET="${BIN}-${{ github.ref_name }}-${{ matrix.target }}.tar.gz"
          tar czf "$ASSET" -C "${{ matrix.release-dir }}" "$BIN"
          echo "ASSET=$ASSET" >> $GITHUB_ENV

      - name: Upload to Release
        uses: softprops/action-gh-release@v3
        with:
          draft: true
          generate_release_notes: true
          files: ${{ env.ASSET }}
