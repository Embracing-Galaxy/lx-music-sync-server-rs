version: 2
updates:
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      axum-ecosystem:
        patterns:
          - "axum"
          - "axum-core"
          - "tokio"
          - "tower"
          - "hyper"
          - "http*"
      rust-patches:
        patterns:
          - "*"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      ci-deps:
        patterns:
          - "*"
