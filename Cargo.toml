[package]
name = "lx-music-sync-server"
version = "0.1.0"
edition = "2024"

[dependencies]
log = "0.4.28"
env_logger = "0.11.8"

rand = "0.9"
openssl = "0.10.73"
base64 = "0.22"
flate2 = "1.1"

serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

dashmap = "6"
arc-swap = { version = "1.7.1" ,features = ["serde"]}
tokio = { version = "1.47", features = ["fs", "macros", "time"] }
async-scoped = {version = "0.9.0", features = ["use-tokio"]}
axum = { version = "0.8", features = ["ws"] }
