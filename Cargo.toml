[package]
name = "lx-music-sync-server"
version = "0.1.2"
edition = "2024"

[dependencies]
log = "0.4"
env_logger = "0.11"
clap = { version = "4.6", default-features = false, features = ["std", "help", "usage", "error-context", "derive"] }
paste = "1.0"

rand = "^0.10"
openssl = "0.10"
base64 = "0.23"
flate2 = "1.1"

serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

dashmap = "6"
arc-swap = { version = "^1.7.1", features = ["serde"] }
futures-util = "0.3"
tokio = { version = "^1.53", features = ["fs", "macros", "rt-multi-thread", "time"] }
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "query", "http2", "ws"] }

[profile.release]
codegen-units = 1
lto = true
strip = true
