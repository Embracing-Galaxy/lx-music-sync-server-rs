[package]
name = "lx-music-sync-server"
version = "0.1.0"
edition = "2024"

[dependencies]
rand = "0.9"
openssl = "0.10.73"
base64 = "0.22"
flate2 = "1.1"

serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

tokio = { version = "1.47", features = ["fs", "macros", "time"] }
async-scoped = {version = "0.9.0", features = ["use-tokio"]}
actix-web = "4"
actix-ws = "0.3"
